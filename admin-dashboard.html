<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduSphere Admin Dashboard</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

background:#0f172a;
color:white;

}



.header{

background:#111827;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:30px;

font-weight:700;

color:#38bdf8;

}



.admin{

background:#1e293b;

padding:12px 20px;

border-radius:12px;

}




.container{

width:90%;

max-width:900px;

margin:40px auto;

}



.card{

background:#1e293b;

padding:35px;

border-radius:25px;

}



h1{

margin-bottom:25px;

text-align:center;

}



.input-group{

margin-bottom:20px;

}



label{

display:block;

margin-bottom:8px;

color:#cbd5e1;

}



input,select{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:#334155;

color:white;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:
linear-gradient(135deg,#3b82f6,#06b6d4);

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}



button:hover{

transform:translateY(-3px);

}



</style>

</head>


<body>


<div class="header">


<div class="logo">
EduSphere 🎓 Admin
</div>


<div class="admin">
👑 Administrator
</div>


</div>





<div class="container">


<div class="card">


<h1>
📚 Upload Learning Material
</h1>




<div class="input-group">

<label>
Class
</label>


<select id="class">

<option>
Class 10
</option>


<option>
Class 12
</option>


</select>

</div>






<div class="input-group">

<label>
Subject
</label>


<input 
id="subject"
placeholder="Example: Mathematics">

</div>







<div class="input-group">

<label>
Chapter
</label>


<input 
id="chapter"
placeholder="Example: Algebra">

</div>







<div class="input-group">

<label>
Material Name
</label>


<input 
id="material"
placeholder="Example: Quadratic Equations Notes">

</div>







<div class="input-group">

<label>
PDF Online Link
</label>


<input 
id="pdf"
placeholder="Paste PDF URL">

</div>







<div class="input-group">

<label>
Video Link
</label>


<input 
id="video"
placeholder="Paste YouTube URL">

</div>






<button onclick="uploadMaterial()">

Upload Material 🚀

</button>



</div>


</div>





<script>

function uploadMaterial(){



let className =
document.getElementById("class").value;


let subject =
document.getElementById("subject").value;


let chapter =
document.getElementById("chapter").value;


let material =
document.getElementById("material").value;


let pdf =
document.getElementById("pdf").value;


let video =
document.getElementById("video").value;




const url =

"https://script.google.com/macros/s/AKfycbzwnc9lARZw8cpazecuBJK5yqfmUOCWETG1_RAPaVrJElFAcFQpoe7mUFTyzCYSiIteZQ/exec"

+
"?action=uploadMaterial"

+
"&class="
+
encodeURIComponent(className)

+
"&subject="
+
encodeURIComponent(subject)

+
"&chapter="
+
encodeURIComponent(chapter)

+
"&material="
+
encodeURIComponent(material)

+
"&pdf="
+
encodeURIComponent(pdf)

+
"&video="
+
encodeURIComponent(video);





fetch(url)



.then(response=>response.json())



.then(data=>{


if(data.status=="success"){


alert(
"Material Uploaded Successfully 🚀"
);



document.querySelectorAll("input")
.forEach(input=>input.value="");



}


})



.catch(error=>{


console.log(error);

alert(
"Upload Failed"
);


});


}



</script>


</body>

</html>
