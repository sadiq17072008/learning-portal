<!DOCTYPE html>
<html>

<head>

<title>EduSphere Admin Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#020617,
#1e40af
);

}



.box{

background:white;

width:400px;

padding:40px;

border-radius:25px;

box-shadow:
0 20px 50px rgba(0,0,0,.3);

}



.logo{

text-align:center;

font-size:35px;

font-weight:800;

color:#2563eb;

margin-bottom:20px;

}



h2{

text-align:center;

color:#1e293b;

margin-bottom:25px;

}



input{

width:100%;

padding:14px;

margin-bottom:20px;

border-radius:12px;

border:1px solid #cbd5e1;

outline:none;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#1d4ed8;

}



</style>

</head>


<body>



<div class="box">


<div class="logo">

EduSphere 🎓

</div>


<h2>
Admin Portal
</h2>



<form onsubmit="adminLogin(event)">



<input 
id="username"
placeholder="Admin Username"
required>



<input 
id="password"
type="password"
placeholder="Password"
required>



<button>

Login

</button>


</form>


</div>






<script>


const scriptURL =

"https://script.google.com/macros/s/AKfycbzwnc9lARZw8cpazecuBJK5yqfmUOCWETG1_RAPaVrJElFAcFQpoe7mUFTyzCYSiIteZQ/exec";




function adminLogin(event){


event.preventDefault();



let username =
document.getElementById("username").value;



let password =
document.getElementById("password").value;



fetch(

scriptURL
+
"?action=adminLogin&username="
+
username
+
"&password="
+
password

)



.then(response=>response.json())



.then(data=>{



if(data.status=="success"){



localStorage.setItem(
"admin",
username
);



alert(
"Welcome Admin 🔥"
);



window.location.href=
"admin-dashboard.html";



}

else{


alert(
"Invalid Admin Credentials"
);


}



})



.catch(error=>{


console.log(error);

alert(
"Connection Error"
);


});



}



</script>



</body>

</html>
