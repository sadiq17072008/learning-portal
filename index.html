<!DOCTYPE html>
<html>

<head>

<title>EduSphere - Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

height:100vh;

background:
linear-gradient(
135deg,
#0f172a,
#2563eb
);

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:900px;

height:500px;

background:white;

border-radius:25px;

overflow:hidden;

display:flex;

box-shadow:
0 20px 50px rgba(0,0,0,0.3);

}




/* LEFT */

.left{

width:55%;

background:
linear-gradient(
135deg,
#2563eb,
#1e40af
);

color:white;

padding:50px;

}



.logo{

font-size:42px;

font-weight:800;

margin-bottom:25px;

}



.left h2{

font-size:30px;

}



.left p{

margin-top:20px;

line-height:1.6;

color:#dbeafe;

}



.features{

margin-top:35px;

}



.features div{

margin:18px 0;

font-size:17px;

}



/* LOGIN */


.login-box{

width:45%;

padding:50px;

}



.login-box h2{

font-size:32px;

color:#1e293b;

}



.login-box p{

color:#64748b;

margin:15px 0 30px;

}



label{

font-weight:600;

color:#334155;

}



input{


width:100%;

padding:14px;

margin:10px 0 20px;

border-radius:12px;

border:1px solid #cbd5e1;

outline:none;

}



input:focus{

border-color:#2563eb;

}



button{


width:100%;

padding:15px;

background:#2563eb;

border:none;

border-radius:12px;

color:white;

font-size:18px;

cursor:pointer;

font-weight:bold;

}



button:hover{

background:#1d4ed8;

}



.register{

text-align:center;

margin-top:25px;

}



.register a{

color:#2563eb;

font-weight:bold;

text-decoration:none;

}




@media(max-width:850px){


.container{

width:90%;

height:auto;

flex-direction:column;

}


.left,
.login-box{

width:100%;

}


}


</style>

</head>



<body>



<div class="container">



<div class="left">


<div class="logo">

EduSphere 🎓

</div>



<h2>

Learn Smarter.
Achieve More.

</h2>


<p>

A complete learning ecosystem for
Class 10 and Class 12 students.

</p>



<div class="features">

<div>
📚 Digital Study Materials
</div>

<div>
📝 Smart Quizzes
</div>

<div>
📈 Track Your Progress
</div>

<div>
🏆 Build Your Future
</div>


</div>


</div>







<div class="login-box">


<h2>
Welcome Back
</h2>


<p>
Login to continue your journey
</p>



<form onsubmit="login(event)">



<label>
Username
</label>


<input
id="username"
type="text"
placeholder="Enter username"
required>



<label>
Password
</label>


<input
id="password"
type="password"
placeholder="Enter password"
required>




<button>

Login 🚀

</button>



</form>



<div class="register">

New student?

<a href="register.html">
Create Account
</a>


</div>


</div>



</div>







<script>


// YOUR GOOGLE APPS SCRIPT URL

const loginURL =
"https://script.google.com/macros/s/AKfycbzwnc9lARZw8cpazecuBJK5yqfmUOCWETG1_RAPaVrJElFAcFQpoe7mUFTyzCYSiIteZQ/exec";





function login(event){


event.preventDefault();



let username =
document.getElementById("username").value;



let password =
document.getElementById("password").value;




fetch(

loginURL
+
"?username="
+
username
+
"&password="
+
password
+
"&action=login"

)



.then(response=>response.json())



.then(data=>{



console.log(data);



if(data.status=="success"){



// save user login

localStorage.setItem(
"username",
username
);



localStorage.setItem(
"name",
data.name
);



alert(
"Welcome to EduSphere 🎓"
);



if(data.role=="Student"){


window.location.href =
"student-dashboard.html";


}


else if(data.role=="Admin"){


window.location.href =
"admin-dashboard.html";


}



}



else{


alert(
"Invalid Username or Password"
);


}



})



.catch(error=>{


console.log(error);


alert(
"Server Connection Error"
);


});



}


</script>



</body>

</html>
