<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>EduSphere - Login</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:'Segoe UI',Arial,sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #2563eb
    );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

    width:900px;

    max-width:100%;

    min-height:500px;

    background:#ffffff;

    border-radius:25px;

    overflow:hidden;

    display:flex;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.30);

}


/* =====================================================
   LEFT SIDE
===================================================== */

.left{

    width:55%;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1e40af
    );

    color:white;

    padding:50px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}


.logo{

    font-size:42px;

    font-weight:800;

    margin-bottom:25px;

}


.left h2{

    font-size:30px;

    line-height:1.2;

}


.left p{

    margin-top:20px;

    line-height:1.6;

    color:#dbeafe;

    font-size:16px;

}


.features{

    margin-top:35px;

}


.features div{

    margin:18px 0;

    font-size:17px;

}


/* =====================================================
   LOGIN SIDE
===================================================== */

.login-box{

    width:45%;

    padding:50px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}


.login-box h2{

    font-size:32px;

    color:#1e293b;

}


.login-box > p{

    color:#64748b;

    margin:15px 0 30px;

}


/* =====================================================
   LABELS
===================================================== */

label{

    display:block;

    font-weight:600;

    color:#334155;

    margin-bottom:7px;

}


/* =====================================================
   INPUTS
===================================================== */

input{

    width:100%;

    padding:14px;

    margin-bottom:20px;

    border-radius:12px;

    border:1px solid #cbd5e1;

    outline:none;

    font-size:16px;

    background:#ffffff;

    color:#1e293b;

}


input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,0.12);

}


input::placeholder{

    color:#94a3b8;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

button{

    width:100%;

    padding:15px;

    background:#2563eb;

    border:none;

    border-radius:12px;

    color:white;

    font-size:18px;

    cursor:pointer;

    font-weight:bold;

    transition:0.2s;

}


button:hover{

    background:#1d4ed8;

}


button:active{

    transform:scale(0.98);

}


button:disabled{

    background:#94a3b8;

    cursor:not-allowed;

    transform:none;

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:14px;

    font-weight:600;

}


.message.error{

    display:block;

    background:#fee2e2;

    color:#b91c1c;

}


.message.success{

    display:block;

    background:#dcfce7;

    color:#15803d;

}


/* =====================================================
   REGISTER
===================================================== */

.register{

    text-align:center;

    margin-top:25px;

    color:#64748b;

}


.register a{

    color:#2563eb;

    font-weight:bold;

    text-decoration:none;

}


.register a:hover{

    text-decoration:underline;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    body{

        padding:15px;

        align-items:flex-start;

    }


    .container{

        width:100%;

        min-height:auto;

        margin-top:20px;

        flex-direction:column;

        border-radius:20px;

    }


    .left{

        width:100%;

        padding:30px 25px;

        text-align:center;

    }


    .logo{

        font-size:34px;

        margin-bottom:18px;

    }


    .left h2{

        font-size:25px;

    }


    .left p{

        font-size:15px;

        margin-top:15px;

    }


    .features{

        margin-top:22px;

    }


    .features div{

        margin:10px 0;

        font-size:15px;

    }


    .login-box{

        width:100%;

        padding:30px 25px;

    }


    .login-box h2{

        font-size:28px;

    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:400px){

    body{

        padding:10px;

    }


    .container{

        margin-top:10px;

    }


    .left{

        padding:25px 18px;

    }


    .login-box{

        padding:25px 18px;

    }


    .logo{

        font-size:30px;

    }


    .left h2{

        font-size:22px;

    }


    .login-box h2{

        font-size:25px;

    }


    input{

        padding:13px;

    }


    button{

        padding:14px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         LEFT SECTION
    ================================================== -->

    <div class="left">


        <div class="logo">

            EduSphere 🧪

        </div>


        <h2>

            Learn Smarter.
            Achieve More.

        </h2>


        <p>

            A complete learning ecosystem for
            Class 10 and Class 12 students.

        </p>


        <div class="features">


            <div>
                📚 Digital Study Materials
            </div>


            <div>
                📝 Smart Quizzes
            </div>


            <div>
                📈 Track Your Progress
            </div>


            <div>
                🏆 Build Your Future
            </div>


        </div>


    </div>



    <!-- =================================================
         LOGIN SECTION
    ================================================== -->

    <div class="login-box">


        <h2>

            Welcome Back

        </h2>


        <p>

            Login to continue your journey

        </p>



        <form
            id="loginForm"
        >


            <label for="email">

                Email Address

            </label>


            <input
                id="email"
                type="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >



            <label for="password">

                Password

            </label>


            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >



            <button
                id="loginButton"
                type="submit"
            >

                Login 🚀

            </button>


        </form>



        <div
            id="message"
            class="message"
        ></div>



        <div class="register">

            New student?

            <a href="register.html">

                Create Account

            </a>

        </div>


    </div>


</div>



<!-- =====================================================
     FIREBASE LOGIN SYSTEM
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

    getFirestore,
    doc,
    getDoc

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIGURATION
===================================================== */

/*
 * IMPORTANT:
 *
 * These values MUST be replaced with the
 * Firebase configuration from YOUR Firebase project.
 *
 * The configuration in login.html and register.html
 * MUST be exactly the same.
 */

const firebaseConfig = {

    apiKey:
        "YOUR_FIREBASE_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_FIREBASE_APP_ID"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginButton");


const message =
    document.getElementById("message");



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if(!email){

            showMessage(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        /* ---------------------------------------------
           DISABLE BUTTON
        --------------------------------------------- */

        loginButton.disabled = true;

        loginButton.textContent =
            "Checking...";


        try{


            /* =========================================
               FIREBASE AUTHENTICATION
            ========================================= */

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            console.log(
                "Firebase login successful:",
                user.uid
            );


            /* =========================================
               GET USER PROFILE FROM FIRESTORE
            ========================================= */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnapshot =
                await getDoc(userRef);


            let userData = {

                uid:
                    user.uid,

                email:
                    user.email,

                role:
                    "Student"

            };


            if(userSnapshot.exists()){

                userData = {

                    ...userData,

                    ...userSnapshot.data()

                };

            }


            /* =========================================
               SAVE NON-SENSITIVE SESSION INFORMATION
            ========================================= */

            /*
             * Firebase Authentication itself handles
             * the authenticated session.
             *
             * We only save profile information here
             * for other EduSphere pages that may need it.
             *
             * NEVER save the password.
             */

            localStorage.setItem(
                "uid",
                user.uid
            );


            localStorage.setItem(
                "email",
                user.email || ""
            );


            localStorage.setItem(
                "username",
                userData.username || ""
            );


            localStorage.setItem(
                "name",
                userData.name ||
                userData.fullName ||
                userData.username ||
                user.email ||
                "Student"
            );


            localStorage.setItem(
                "role",
                userData.role ||
                "Student"
            );


            localStorage.setItem(
                "currentUser",
                JSON.stringify(userData)
            );


            /* =========================================
               SUCCESS MESSAGE
            ========================================= */

            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            /* =========================================
               REDIRECT
            ========================================= */

            setTimeout(function(){

                const role =
                    String(
                        userData.role ||
                        "Student"
                    ).toLowerCase();


                if(role === "admin"){

                    window.location.href =
                        "admin-dashboard.html";

                }

                else{

                    window.location.href =
                        "student-dashboard.html";

                }

            },700);


        }

        catch(error){

            console.error(
                "Firebase login error:",
                error
            );


            /* =========================================
               FIREBASE ERROR HANDLING
            ========================================= */

            let errorMessage =
                "Invalid email or password.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                errorMessage =
                    "Invalid email or password.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ){

                errorMessage =
                    "Please enter a valid email address.";

            }


            else if(
                error.code ===
                "auth/user-not-found"
            ){

                errorMessage =
                    "No account exists with this email.";

            }


            else if(
                error.code ===
                "auth/wrong-password"
            ){

                errorMessage =
                    "Incorrect password.";

            }


            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                errorMessage =
                    "Too many failed attempts. Please try again later.";

            }


            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                errorMessage =
                    "Network error. Please check your internet connection.";

            }


            else if(
                error.code ===
                "auth/operation-not-allowed"
            ){

                errorMessage =
                    "Email/Password login is not enabled in Firebase.";

            }


            else if(
                error.code ===
                "permission-denied"
            ){

                errorMessage =
                    "Login worked, but your profile could not be accessed. Check Firestore rules.";

            }


            else{

                errorMessage =
                    "Login failed: " +
                    (
                        error.message ||
                        "Unknown Firebase error."
                    );

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Login 🚀";

        }

    }
);


/* =====================================================
   FIREBASE AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            console.log(
                "Firebase authenticated user:",
                user.uid
            );

        }

        else{

            console.log(
                "No Firebase user currently signed in."
            );

        }

    }
);


</script>


</body>

</html>
