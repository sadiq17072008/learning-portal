<title>EduSphere 🧪 | Student Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eaf6ff, #ffffff);
        display: flex;
        flex-direction: column;
    }

    /* HEADER */
    header {
        width: 100%;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        padding: 18px 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-size: 26px;
        font-weight: 800;
        color: #0b5ed7;
        text-decoration: none;
    }

    .logo span {
        color: #123c73;
    }

    /* LOGIN AREA */
    .login-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .login-card {
        width: 100%;
        max-width: 430px;
        background: #ffffff;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 45px rgba(0, 75, 150, 0.12);
        border: 1px solid #e5eef8;
    }

    .login-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #e8f4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
    }

    .login-card h1 {
        text-align: center;
        color: #123c73;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 15px;
        margin-bottom: 30px;
    }

    /* FORM */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #1f2937;
        font-weight: 600;
        font-size: 14px;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
    }

    .form-group input {
        width: 100%;
        padding: 14px 15px 14px 45px;
        border: 1px solid #d5dde8;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: 0.2s;
    }

    .form-group input:focus {
        border-color: #0b5ed7;
        box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.10);
    }

    /* LOGIN BUTTON */
    .login-btn {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 15px;
        background: #0b5ed7;
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 5px;
    }

    .login-btn:hover {
        background: #084da8;
        transform: translateY(-1px);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    /* ERROR */
    .error-message {
        display: none;
        margin-top: 18px;
        padding: 12px;
        border-radius: 8px;
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #be123c;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
    }

    .success-message {
        display: none;
        margin-top: 18px;
        padding: 12px;
        border-radius: 8px;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #047857;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
    }

    /* DEMO ACCOUNT */
    .demo-box {
        margin-top: 25px;
        padding: 15px;
        background: #f0f7ff;
        border: 1px solid #d7eaff;
        border-radius: 10px;
        text-align: center;
        color: #31577f;
        font-size: 13px;
    }

    .demo-box strong {
        color: #123c73;
    }

    /* FOOTER */
    footer {
        text-align: center;
        padding: 20px;
        color: #6b7280;
        font-size: 13px;
        background: #ffffff;
        border-top: 1px solid #e5e7eb;
    }

    /* MOBILE */
    @media (max-width: 600px) {

        header {
            padding: 16px 20px;
        }

        .logo {
            font-size: 22px;
        }

        .login-wrapper {
            padding: 25px 15px;
        }

        .login-card {
            padding: 30px 22px;
            border-radius: 16px;
        }

        .login-card h1 {
            font-size: 26px;
        }
    }
</style>

</head>

<body>

```
<!-- HEADER -->
<header>
    <a href="login.html" class="logo">
        EduSphere <span>🧪</span>
    </a>
</header>


<!-- LOGIN -->
<main class="login-wrapper">

    <div class="login-card">

        <div class="login-icon">
            🎓
        </div>

        <h1>Student Login</h1>

        <p class="subtitle">
            Login to continue your EduSphere learning journey
        </p>


        <form id="loginForm">

            <!-- USERNAME -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <!-- BUTTON -->
            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <!-- ERROR -->
            <div
                id="errorMessage"
                class="error-message"
            ></div>


            <!-- SUCCESS -->
            <div
                id="successMessage"
                class="success-message"
            >
                Login successful! Redirecting...
            </div>

        </form>


        <!-- ACCOUNT INFORMATION -->
        <div class="demo-box">

            <strong>Student Account</strong>
            <br><br>

            Username:
            <strong>student</strong>

            <br>

            Password:
            <strong>12345</strong>

        </div>

    </div>

</main>


<!-- FOOTER -->
<footer>
    © 2026 EduSphere Learning Portal
</footer>


<script>

    /*
    =====================================================
    EDUSPHERE SIMPLE LOGIN
    =====================================================

    Username : student
    Password : 12345

    No Firebase
    No database
    No Google Sheets
    No Apps Script
    =====================================================
    */


    const CORRECT_USERNAME = "student";
    const CORRECT_PASSWORD = "12345";


    const loginForm =
        document.getElementById("loginForm");

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");


    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;


            /* Hide previous messages */

            errorMessage.style.display = "none";

            successMessage.style.display = "none";


            /* Check login */

            if (
                username === CORRECT_USERNAME &&
                password === CORRECT_PASSWORD
            ) {

                /*
                Store login status locally.

                This does NOT store the password.
                */

                localStorage.setItem(
                    "edusphereLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "edusphereUsername",
                    "student"
                );

                localStorage.setItem(
                    "edusphereRole",
                    "Student"
                );


                /* Show success */

                successMessage.style.display =
                    "block";


                /*
                Redirect to student dashboard.

                Change this filename only if your
                dashboard has a different filename.
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "student-dashboard.html";

                    },
                    700
                );

            }

            else {

                errorMessage.textContent =
                    "Incorrect username or password.";

                errorMessage.style.display =
                    "block";

                passwordInput.value = "";

                passwordInput.focus();

            }

        }
    );

</script>
```
